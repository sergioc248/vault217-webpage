# fly.toml app configuration file generated for vault217-webpage on 2026-10-22T04:02:44-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'vault217-webpage'
primary_region = 'iad'

[build]
[http_service]
  # php:8.5.12-apache listens on port 80 inside the container.
  internal_port = 80
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
